name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Windows native: WinUI 3, the Windows App SDK and WASAPI do not run on Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # CLAUDE.md is read in full on every task, so its length is a running cost. The ceiling is
      # there to force an eviction rather than an append; the rule it enforces is in the file.
      - name: CLAUDE.md stays within its budget
        shell: pwsh
        run: |
          $limit = 175
          # Not Measure-Object -Line: it skips blank lines, so it would report a number nobody
          # else's line count agrees with.
          $lines = @(Get-Content CLAUDE.md).Count
          if ($lines -gt $limit) {
            Write-Host "::error file=CLAUDE.md::$lines lines, budget is $limit. Move a section to docs/ and leave the line that says when to open it — see 'What belongs in this file'."
            exit 1
          }
          Write-Host "CLAUDE.md: $lines/$limit lines"

      # The day's engine says it runs here and did not, so nothing held it: a crash in how it keys a
      # denied command took down the atom that records a verdict and the one that ends a day, with a
      # paid session already spent. It spends none itself.
      #
      # `powershell` and not `pwsh`, which is the whole reason this is worth running: the atoms are
      # Windows PowerShell 5.1 and so is what breaks them. The same script on pwsh sits on .NET
      # Core, where the call that threw returns quietly — green, and about a shell nothing uses.
      - name: The unattended day's engine
        shell: powershell
        run: .\.claude\orchestrator\test-day.ps1

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build
